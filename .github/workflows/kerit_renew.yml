name: Kerit Renew

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install seleniumbase

      - name: 安装 sing-box
        run: |
          curl -sSfL https://sing-box.app/install.sh | sh -s -- -b /usr/local/bin

      - name: 生成 sing-box 配置
        env:
          PROXY_STR: ${{ secrets.HY2_PROXY_URL }}
        run: |
          python generate_singbox_config.py
          cat config.json

      - name: 启动 sing-box
        run: |
          sing-box run -c config.json &
          sleep 2
          ss -tlnp | grep 8080

      - name: 解析账号信息
        run: |
          ACCOUNT=*** secrets.KERIT_ACCOUNT }}
          export EMAIL="${ACCOUNT%%,*}"
          export PASSWORD="${ACCOUNT#*,}"
          echo "EMAIL=$EMAIL" >> $GITHUB_ENV

      - name: 解析 Telegram 配置
        run: |
          TG=${{ secrets.TG_BOT }}
          export TG_CHAT_ID="${TG%%,*}"
          export TG_TOKEN="${TG#*,}"

      - name: 安装 xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: 运行续期
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python kerit_renew.py

      - name: 上传截图
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kerit-screenshots
          path: artifacts/
          retention-days: 7
